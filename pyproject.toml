[tool.poetry]
name = "teda"
version = "4.1.0"  # also update in teda/version.py
description = "Yet Another FITS Viewer"
authors = ["majkelx <mkalusz@camk.edu.pl>"]
license = "MIT"
readme = "README.md"
include = ["assets/*"]

[tool.poetry.dependencies]
python = ">=3.11,<3.14"
pyside6 = "^6.11.0"
astropy = "^7.0"
matplotlib = "^3.10"
scipy = "^1.16"
traitlets = "^5.15"
numpy = "^2.0"
#pyaraucaria = "^2.7.0"
qtconsole = {version="^5.7", optional=true}
watchdog = {version="^6.0", optional=true}

[tool.poetry.scripts]
teda = "teda.teda_fits:main"

[tool.poetry.extras]
console = ["qtconsole"]
watchdog = ["watchdog"]


[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
